<!DOCTYPE html>
<html>
<head>
  <title>Keyboard Iframe Launcher</title>
</head>
<body>

<script>
document.addEventListener("keydown", function(e) {
    if (e.key.toLowerCase() === "k") {  // change key here
        const win = window.open("about:blank");

        if (!win) {
            alert("Popup blocked. Enable popups for this site.");
            return;
        }

        const site = "https://example.com"; // change this

        win.document.write(`
            <html>
            <head>
                <title>Iframe Loader</title>
                <style>
                    html, body {
                        margin: 0;
                        padding: 0;
                        height: 100%;
                        overflow: hidden;
                    }
                    iframe {
                        width: 100%;
                        height: 100%;
                        border: none;
                    }
                </style>
            </head>
            <body>
                <iframe src="${site}"></iframe>
            </body>
            </html>
        `);

        win.document.close();
    }
});
</script>

<h1>Press "K" to open the iframe tab</h1>

</body>
</html>
